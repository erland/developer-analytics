quarkus.application.name=developer-analytics-backend

# PostgreSQL is the single persistence technology for all runtime profiles.
# In dev/test, Quarkus Dev Services can start PostgreSQL automatically when Docker is available.
# In deployed environments, set QUARKUS_DATASOURCE_JDBC_URL together with credentials.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:developer_analytics}
quarkus.datasource.password=${DB_PASSWORD:developer_analytics}

# Flyway is the schema authority. Migrations are applied before Hibernate validates mappings.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.validate-in-dev-mode=true

# Never allow ORM schema generation in tests either; tests must use Flyway-created schema.
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.migrate-at-start=true

# Runtime role
developer-analytics.runtime-role=${APP_RUNTIME_ROLE:api}
developer-analytics.worker.poll-interval=${WORKER_POLL_INTERVAL:2s}
developer-analytics.worker.id=${WORKER_ID:worker-1}

# GitHub sign-in. Configure these for a GitHub App user-authorization flow.
developer-analytics.github.client-id=${GITHUB_CLIENT_ID:local-unconfigured-client-id}
developer-analytics.github.client-secret=${GITHUB_CLIENT_SECRET:local-unconfigured-client-secret}
developer-analytics.github.callback-url=${GITHUB_CALLBACK_URL:http://localhost:8080/api/auth/github/callback}
developer-analytics.frontend-url=${FRONTEND_URL:http://localhost:8080/}

# Service-owned browser session.
developer-analytics.session.hours=${SESSION_HOURS:8}
developer-analytics.session.cookie-secure=${SESSION_COOKIE_SECURE:false}


# Provider credential encryption.
# Must be a Base64-encoded 32-byte random key outside tests.
developer-analytics.credentials.encryption-key=${CREDENTIAL_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
developer-analytics.credentials.key-version=${CREDENTIAL_KEY_VERSION:v1}

# Keep Hibernate JSON persistence formatting independent from REST/Jackson customization.
quarkus.hibernate-orm.mapping.format.global=ignore
