objectives:
  - Minska lagerövertramp i centrala API-flöden utan att ändra externt beteende.
  - Förbättra testbarheten före strukturella förändringar.
  - Göra frontendens nätverkskod och dependency-installation mer reproducerbar stegvis.
constraints:
  - Bevara API-kontrakt och användarbeteende under refaktoreringsstegen.
  - Ingen ramverksmigration eller mikroserviceuppdelning.
  - Privacy-regler får inte försvagas.
steps:
