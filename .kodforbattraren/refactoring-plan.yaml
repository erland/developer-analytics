objectives:
- Minska lagerövertramp i centrala API-flöden utan onödiga kontraktsförändringar.
- Förbättra testbarheten före riskfyllda beteendeändringar.
- Bevara och verifiera privacy-semantik explicit.
- Göra frontendens nätverkskod och dependency-installation mer reproducerbar stegvis.
constraints:
- Ingen ramverksmigration eller mikroserviceuppdelning.
- Privacy-regler får inte försvagas.
- Riskfyllda beteendeändringar ska föregås av characterization tests.
- Ingen massmigrering av frontend fetch-anrop; endast konkreta callers med duplicerad gemensam GET-mekanik migreras inkrementellt.
