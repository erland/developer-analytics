name: Validate Coolify deployment

on:
  pull_request:
    paths:
      - 'deploy/coolify/**'
      - '.github/workflows/validate-coolify.yml'
  push:
    branches:
      - main
    paths:
      - 'deploy/coolify/**'
      - '.github/workflows/validate-coolify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-coolify:
    name: Validate Coolify configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Coolify Compose configuration
        env:
          APP_VERSION: 0.0.0-ci
          DB_HOST: ci-postgres.internal
          DB_NAME: developer_analytics
          DB_USERNAME: developer_analytics
          DB_PASSWORD: ci-validation-password
          GITHUB_CLIENT_ID: ci-client-id
          GITHUB_CLIENT_SECRET: ci-client-secret
          CREDENTIAL_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          CREDENTIAL_KEY_VERSION: ci-v1
        run: docker compose -f deploy/coolify/compose.yaml config --quiet

      - name: Verify Coolify topology invariants
        env:
          APP_VERSION: 0.0.0-ci
          DB_HOST: ci-postgres.internal
          DB_NAME: developer_analytics
          DB_USERNAME: developer_analytics
          DB_PASSWORD: ci-validation-password
          GITHUB_CLIENT_ID: ci-client-id
          GITHUB_CLIENT_SECRET: ci-client-secret
          CREDENTIAL_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          CREDENTIAL_KEY_VERSION: ci-v1
        shell: bash
        run: |
          set -euo pipefail

          docker compose -f deploy/coolify/compose.yaml config --format json > /tmp/coolify-compose.json

          jq -e '
            (.services | has("db") | not) and
            (.services | has("postgres") | not) and
            (.services["developer-analytics-backend"] != null) and
            (.services.web.environment.DEVELOPER_ANALYTICS_BACKEND_HOST == "developer-analytics-backend") and
            (.services["developer-analytics-backend"].environment.QUARKUS_DATASOURCE_JDBC_URL == "jdbc:postgresql://ci-postgres.internal:5432/developer_analytics")
          ' /tmp/coolify-compose.json > /dev/null
