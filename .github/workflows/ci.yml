name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build production frontend
        run: npm run build

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify backend
        run: mvn --batch-mode --no-transfer-progress verify


  containers:
    name: Container build validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker Compose configuration
        env:
          DB_PASSWORD: ci-validation-password
          CREDENTIAL_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          CREDENTIAL_KEY_VERSION: ci-v1
        run: docker compose -f deploy/compose.yaml config --quiet

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: developer-analytics-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: developer-analytics-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  backup-restore:
    name: PostgreSQL backup/restore verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Start migrated database
        env:
          DB_PASSWORD: ci-backup-restore-password
          CREDENTIAL_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          CREDENTIAL_KEY_VERSION: ci-v1
        run: docker compose -f deploy/compose.yaml up -d --build db backend

      - name: Verify PostgreSQL backup and restore
        env:
          DB_PASSWORD: ci-backup-restore-password
          CREDENTIAL_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          CREDENTIAL_KEY_VERSION: ci-v1
        run: ./scripts/test-postgres-backup-restore.sh

      - name: Show service logs on failure
        if: failure()
        env:
          DB_PASSWORD: ci-backup-restore-password
          CREDENTIAL_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          CREDENTIAL_KEY_VERSION: ci-v1
        run: docker compose -f deploy/compose.yaml logs --no-color db backend

      - name: Stop verification stack
        if: always()
        env:
          DB_PASSWORD: ci-backup-restore-password
          CREDENTIAL_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          CREDENTIAL_KEY_VERSION: ci-v1
        run: docker compose -f deploy/compose.yaml down -v
