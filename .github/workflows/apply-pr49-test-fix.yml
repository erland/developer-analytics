name: Apply PR 49 test fix

on:
  push:
    branches:
      - zip-github/work-7de8338d-df96-44ff-88b9-b82466d9d0d8

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: zip-github/work-7de8338d-df96-44ff-88b9-b82466d9d0d8
      - name: Apply exact test fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          feature = Path('frontend/src/test-layers/feature/ExploreCurrentBehaviourFeature.test.tsx')
          text = feature.read_text()
          old = "    expect(screen.queryByRole('button', { name: 'Suppress technology inference' })).not.toBeInTheDocument()\n"
          if old not in text:
              raise SystemExit('Expected Technology <details> assertion not found')
          feature.write_text(text.replace(old, '', 1))

          mobile = Path('frontend/e2e/mobile/primary-flows.spec.ts')
          text = mobile.read_text()
          old = "  const technologySelect = page.getByLabel('Technology')"
          new = "  const technologySelect = page.getByLabel('Technology', { exact: true })"
          if old not in text:
              raise SystemExit('Expected Playwright Technology selector not found')
          text = text.replace(old, new, 1)
          text = text.replace("page.locator('.inventory-filters')", "page.locator('.project-scope-filters')")
          mobile.write_text(text)
          PY
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-pr49-test-fix.yml
          git add frontend/src/test-layers/feature/ExploreCurrentBehaviourFeature.test.tsx frontend/e2e/mobile/primary-flows.spec.ts
          git commit -m "Fix remaining frontend acceptance tests"
          git push origin HEAD:zip-github/work-7de8338d-df96-44ff-88b9-b82466d9d0d8
