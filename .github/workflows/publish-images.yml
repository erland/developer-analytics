name: Publish container images

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Validate published release tag and main CI
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must use semantic version format vMAJOR.MINOR.PATCH (for example v1.0.1)." >&2
            exit 1
          }

          git fetch origin main --tags --force
          release_commit="$(git rev-list -n 1 "${TAG}")"

          git merge-base --is-ancestor "${release_commit}" origin/main || {
            echo "Release tag ${TAG} points to ${release_commit}, which is not on main." >&2
            exit 1
          }

          successful_ci="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow ci.yml \
              --commit "${release_commit}" \
              --event push \
              --limit 20 \
              --json status,conclusion,headSha \
              | jq --arg sha "${release_commit}" '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")] | length'
          )"

          if [[ "${successful_ci}" -lt 1 ]]; then
            echo "No successful push-to-main CI run was found for release commit ${release_commit}." >&2
            echo "Wait for CI on main to finish successfully before publishing the GitHub Release." >&2
            exit 1
          fi

          echo "Validated ${TAG} at ${release_commit}: commit is on main and its push CI passed."

      - name: Explain manual image publication
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual dispatch publishes SHA-tagged images only."
          echo "Versioned releases must be created by publishing a GitHub Release."

  publish:
    name: Publish ${{ matrix.component }} image
    needs:
      - validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            dockerfile: frontend/Dockerfile
            image: developer-analytics-web
            cache_scope: release-web
          - component: backend
            dockerfile: backend/Dockerfile
            image: developer-analytics-backend
            cache_scope: release-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Developer Analytics ${{ matrix.component }}
            org.opencontainers.image.description=Developer Analytics ${{ matrix.component }} container image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  verify-release:
    name: Verify clean GHCR installation
    if: github.event_name == 'release'
    needs:
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Verify clean GHCR pull, tags and image hygiene
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: bash ./scripts/verify-ghcr-release.sh "${{ github.event.release.tag_name }}"

      - name: Start and smoke-test published release images
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          WEB_PORT: '18082'
          RELEASE_VERIFY_BASE_URL: http://localhost:18082
        run: bash ./scripts/test-published-release-runtime.sh "${{ github.event.release.tag_name }}"

      - name: Show release verification logs on failure
        if: failure()
        env:
          APP_VERSION: ${{ github.event.release.tag_name }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/developer-analytics-web
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/developer-analytics-backend
          WEB_PORT: '18082'
          DB_PASSWORD: release-verify-db-password
          CREDENTIAL_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          GITHUB_CLIENT_ID: release-verify-client-id
          GITHUB_CLIENT_SECRET: release-verify-client-secret
          GITHUB_CALLBACK_URL: http://localhost:18082/api/auth/github/callback
          FRONTEND_URL: http://localhost:18082/
          SESSION_COOKIE_SECURE: 'false'
        run: docker compose -p developer-analytics-release-verify -f deploy/compose.release.example.yaml logs --no-color db backend worker web || true

      - name: Ensure release verification stack is stopped
        if: always()
        env:
          APP_VERSION: ${{ github.event.release.tag_name }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/developer-analytics-web
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/developer-analytics-backend
          WEB_PORT: '18082'
          DB_PASSWORD: release-verify-db-password
          CREDENTIAL_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          GITHUB_CLIENT_ID: release-verify-client-id
          GITHUB_CLIENT_SECRET: release-verify-client-secret
          GITHUB_CALLBACK_URL: http://localhost:18082/api/auth/github/callback
          FRONTEND_URL: http://localhost:18082/
          SESSION_COOKIE_SECURE: 'false'
        run: docker compose -p developer-analytics-release-verify -f deploy/compose.release.example.yaml down -v --remove-orphans || true
